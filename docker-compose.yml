services:
  postgres_db:
    image: postgres:15-alpine
    container_name: cyber_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  chroma_app:
    image: chromadb/chroma:latest
    container_name: cyber_chroma_app
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_data:/chroma/chroma
    environment:
      - ALLOW_RESET=true
      - IS_PERSISTENT=true
  etl_app:
    build: .
    container_name: cyber_etl_app
    depends_on:
      - postgres_db
      - chroma_app
    env_file:
      - .env
    volumes:
      - .:/app
  ml_app:
    build: .
    container_name: cyber_ml_app
    depends_on:
      - postgres_db
    env_file:
      - .env
    volumes:
      - .:/app
    command: ["python", "ml_predictor.py"]
  redis_db:
    image: redis:7-alpine
    container_name: cyber_redis
    ports:
      - "6380:6379"
    restart: always
  scraper_app:
    build: .
    container_name: cyber_scraper_app
    depends_on:
      - redis_db
    volumes:
      - .:/app
    command: ["python", "osint_scraper.py"]
  redis_consumer:
    build: .
    container_name: cyber_redis_app
    depends_on:
      - redis_db
      - postgres_db
      - chroma_app
    env_file:
      - .env
    volumes:
      - .:/app
    command: ["python", "-u", "redis_consumer.py"]